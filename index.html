<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: "Segoe UI", sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 90%;
    }

    h1 {
      color: #ff3366;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #444;
      margin-bottom: 30px;
    }

    button {
      font-size: 20px;
      padding: 12px 30px;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
    }

    #yes {
      background: #ff3366;
      color: white;
    }

    #no {
      background: #aaa;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hey Harika 💖</h1>
    <p>Will you be my Valentine?</p>

    <button id="yes" onclick="yesClicked()">YES 💕</button>
    <button id="no" onclick="noClicked()">NO 😳</button>
  </div>

  <script>
    let yesSize = 20;
    let noSize = 20;
    let noTexts = [
      "Are you sure? 😢",
      "Think again 🥺",
      "But I’m cute 😔",
      "Pleaseee 🥹",
      "My heart 😭",
      "Okay okay… 💔"
    ];
    let noIndex = 0;

    function noClicked() {
      noSize -= 3;
      if (noSize < 6) noSize = 6;
      document.getElementById("no").style.fontSize = noSize + "px";

      document.getElementById("no").innerText =
        noTexts[noIndex % noTexts.length];
      noIndex++;
    }

    function yesClicked() {
      yesSize += 5;
      document.getElementById("yes").style.fontSize = yesSize + "px";

      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          font-family:'Segoe UI',sans-serif;
          text-align:center;
          padding:20px;
        ">
          <div>
            <h1 style="color:#ff3366;font-size:42px;">
              YAYYY 💕💖
            </h1>
            <p style="font-size:22px;color:#444;">
              You just made my Valentine’s Day special 🌸<br><br>
              Forever yours,<br>
              <b>Navdeep ❤️</b>
            </p>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
