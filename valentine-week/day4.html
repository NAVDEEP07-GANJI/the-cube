<!DOCTYPE html>
<html>
<head>
<title>Teddy Day 🧸</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;height:100vh;background:linear-gradient(#fff0f6,#fff);font-family:Segoe UI;display:flex;justify-content:center;align-items:center;text-align:center;color:#ff2e75}
.card{max-width:900px;padding:40px;animation:fadeIn 1.5s}
h1{font-size:3.5rem}
p{font-size:1.7rem;line-height:1.7;margin:35px 0}
a{padding:18px 55px;background:linear-gradient(135deg,#ff5b95,#ffb6d2);color:white;border-radius:60px;text-decoration:none;font-size:1.4rem;animation:pulse 1.8s infinite}
@keyframes fadeIn{from{opacity:0;transform:translateY(40px)}to{opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>

<body>
<div class="card">
<h1>Teddy Day 🧸</h1>

<p>
If I could give you something today,<br>
it wouldn’t be a teddy.
</p>

<p>
It would be the feeling of safety,<br>
the kind where you don’t have to pretend.
</p>

<a href="day5.html">Next feeling 🌸</a>
</div>
</body>
</html>
