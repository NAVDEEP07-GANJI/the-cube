<!DOCTYPE html>
<html>
<head>
<title>Valentine’s Day ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;height:100vh;background:linear-gradient(#ffd1e8,#ffe8f2);font-family:'Segoe UI';overflow:hidden;text-align:center;}
.container{padding:60px 20px;animation:fadeUp 1.5s;}
h1{color:#ff3f7f;font-size:40px;}
p{font-size:20px;color:#555;line-height:1.7;}
.heart{position:absolute;bottom:-20px;font-size:26px;animation:float 8s infinite;}
@keyframes float{0%{transform:translateY(0);}100%{transform:translateY(-120vh);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;}}
</style>
</head>
<body>

<script>
for(let i=0;i<30;i++){
 let h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤️";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(6+Math.random()*6)+"s";
 document.body.appendChild(h);
}
</script>

<div class="container">
<h1>❤️ Valentine’s Day</h1>
<p>
HARU,<br><br>
I like you — honestly and deeply.<br>
No pressure. No expectations.<br><br>
Just DEEPU 💗
</p>
</div>

</body>
</html>
