<!DOCTYPE html>
<html>
<head>
<title>Valentine’s Day 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;height:100vh;background:linear-gradient(#ffd1e8,#fff);font-family:Segoe UI;display:flex;justify-content:center;align-items:center;text-align:center;color:#ff2e75}
.card{max-width:900px;padding:40px;animation:fadeIn 1.5s}
h1{font-size:3.5rem}
p{font-size:1.8rem;line-height:1.8;margin:40px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(40px)}to{opacity:1}}
</style>
</head>

<body>
<div class="card">
<h1>Valentine’s Day 💖</h1>

<p>
Haru,<br><br>
I didn’t make this to impress you.<br>
I made this because I care.
</p>

<p>
Thank you for being my Valentine 💗<br>
— Deepu
</p>

</div>
</body>
</html>
